version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: is-database
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  php:
    build:
      context: ./backend-inboxsystem
      dockerfile: Dockerfile
    container_name: is-backend
    working_dir: /var/www
    volumes:
      - ./backend-inboxsystem:/var/www

    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: is-nginx
    ports:
      - "8000:80"

    volumes:
      - ./backend-inboxsystem:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

    networks:
      - app-network

  react:
    image: node:22
    container_name: is-frontend
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-inboxsystem:/app
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: is-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql

    depends_on:
      - mysql
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network: