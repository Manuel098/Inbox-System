version: "3.9"
services:
  mysql:
    container_name: is-dev-db
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
  php:
    container_name: is-dev-back
    build:
      context: ./backend-inboxsystem
      dockerfile: Dockerfile.dev
    working_dir: /var/www
    volumes:
      - ./backend-inboxsystem:/var/www
    networks:
      - app-network
  nginx:
    container_name: is-dev-nginx
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./backend-inboxsystem:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.dev.conf
    depends_on:
      - php
    networks:
      - app-network
  frontend:
    container_name: is-dev-front
    build:
      context: ./frontend-inboxsystem
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./frontend-inboxsystem:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - app-network
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    stdin_open: true
    tty: true
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: is-dev-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql

    depends_on:
      - mysql
    networks:
      - app-network
volumes:
  mysql_data:
networks:
  app-network: